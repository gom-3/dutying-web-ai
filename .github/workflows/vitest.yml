name: Web CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: npm ci
        run: PUPPETEER_DOWNLOAD_BASE_URL="https://storage.googleapis.com/chrome-for-testing-public" pnpm install --frozen-lockfile
      - name: Check translation catalog structure
        run: node --test apps/app/scripts/i18n-catalog-utils.node-test.mjs && node apps/app/scripts/i18n-check-catalog.mjs
      - name: Check release tooling and build provenance
        run: pnpm run release:test
      - name: Run tests including autofill and adjustment scenarios
        run: pnpm --dir apps/app exec vitest run --reporter=default --reporter=junit --outputFile.junit=../../artifacts/tests.xml
      - name: Build app
        run: pnpm run build:app
        env:
          VITE_APP_PUBLIC_URL: ${{ github.ref == 'refs/heads/develop' && 'https://dev.dutying.ai' || 'https://www.dutying.ai' }}
          VITE_SERVER_URL: ${{ github.ref == 'refs/heads/develop' && 'https://dev.api.dutying.ai' || 'https://api.dutying.ai' }}
      - name: Verify billing entry and provider return routes
        run: node scripts/release/verify-billing-build.mjs apps/app/dist
      - name: Retain verified web deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: apps/app/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Publish test and AI scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-scenarios
          path: artifacts/*.xml
          if-no-files-found: warn

  deploy:
    name: Deploy or verify Cloudflare Pages
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      PAGES_PROJECT: ${{ github.ref == 'refs/heads/develop' && 'dutying-web-ai-dev' || 'dutying-web-ai' }}
      PUBLIC_URL: ${{ github.ref == 'refs/heads/develop' && 'https://dev.dutying.ai' || 'https://www.dutying.ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/download-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: apps/app/dist/
      - name: Select direct upload or existing Git integration
        id: authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            echo 'No upload token: verify the existing Cloudflare Git integration deployment.'
          fi
      - name: Deploy the tested artifact
        id: pages
        if: steps.authentication.outputs.upload == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 53466deaa5db27ed5bbeca1377a9e721
          wranglerVersion: '4.156.1'
          command: pages deploy apps/app/dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed commit on Pages and public domain
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          for attempt in $(seq 1 18); do
            if bash .codex/skills/dutying-web-release-verify/scripts/verify-public-release.sh \
              --url "$PUBLIC_URL/release.json" --expect-text "$GITHUB_SHA"; then
              if [ -z "$DEPLOYMENT_URL" ]; then
                DEPLOYMENT_URL=$(node scripts/release/existing-pages-deployment.mjs \
                  "$PUBLIC_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$PAGES_PROJECT") || exit 1
              fi
              bash .codex/skills/dutying-web-release-verify/scripts/verify-public-release.sh \
                --url "${DEPLOYMENT_URL%/}/release.json" --expect-text "$GITHUB_SHA"
              printf 'Published %s at %s (Pages: %s)\n' "$GITHUB_SHA" "$PUBLIC_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::No matching public deployment. Enable Cloudflare Git deployments or set CLOUDFLARE_API_TOKEN and re-run this job.'
          exit 1
          retention-days: 7
