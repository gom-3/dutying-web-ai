name: Web CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: npm ci
        run: PUPPETEER_DOWNLOAD_BASE_URL="https://storage.googleapis.com/chrome-for-testing-public" pnpm install --frozen-lockfile
      - name: Run tests including autofill and adjustment scenarios
        run: pnpm --dir apps/app exec vitest run --reporter=default --reporter=junit --outputFile.junit=../../artifacts/tests.xml
      - name: Publish test and AI scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-scenarios
          path: artifacts/*.xml
          if-no-files-found: warn
