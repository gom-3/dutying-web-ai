        <script>
            // Keep legacy language links on the matching static URL before content is painted.
            if (location.pathname === '/') {
                const landingParams = new URLSearchParams(location.search);
                const landingLanguage = (landingParams.get('lng') || '').toLowerCase().split(/[-_]/)[0];
                if (['en', 'ja', 'zh', 'th', 'vi'].includes(landingLanguage)) {
                    landingParams.delete('lng');
                    const landingSearch = landingParams.toString();
                    location.replace('/' + landingLanguage + (landingSearch ? '?' + landingSearch : '') + location.hash);
                }
            }
        </script>
