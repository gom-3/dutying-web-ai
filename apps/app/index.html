            <style>
                .marketing-fallback {
                    box-sizing: border-box;
                    min-height: 100vh;
                    background: #f8f5ff;
                    color: #150b3c;
                    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
                }
                .marketing-fallback * {
                    box-sizing: border-box;
                }
                .marketing-fallback__header {
                    display: flex;
                    height: 64px;
                    align-items: center;
                    background: #ffffff;
                    padding: 0 20px;
                }
                .marketing-fallback__header-inner {
                    width: 100%;
                    max-width: 1180px;
                    margin: 0 auto;
                }
                .marketing-fallback__logo {
                    display: block;
                    width: auto;
                    height: 29px;
                }
                .marketing-fallback__hero {
                    display: grid;
                    min-height: calc(100vh - 64px);
                    align-items: center;
                    gap: 40px;
                    max-width: 1180px;
                    margin: 0 auto;
                    padding: 56px 20px 40px;
                }
                .marketing-fallback__content {
                    position: relative;
                    z-index: 1;
                    max-width: 620px;
                }
                .marketing-fallback__eyebrow {
                    margin: 0 0 16px;
                    color: #7047eb;
                    font-size: 15px;
                    font-weight: 800;
                    letter-spacing: -0.01em;
                }
                .marketing-fallback__title {
                    margin: 0;
                    color: #150b3c;
                    font-size: clamp(34px, 7vw, 56px);
                    font-weight: 850;
                    letter-spacing: -0.045em;
                    line-height: 1.16;
                    word-break: keep-all;
                }
                .marketing-fallback__description {
                    max-width: 600px;
                    margin: 24px 0 0;
                    color: #5f557f;
                    font-size: 17px;
                    font-weight: 500;
                    letter-spacing: -0.02em;
                    line-height: 1.75;
                    word-break: keep-all;
                }
                .marketing-fallback__actions {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 12px;
                    margin-top: 36px;
                }
                .marketing-fallback__action {
                    display: inline-flex;
                    min-height: 48px;
                    align-items: center;
                    justify-content: center;
                    border-radius: 10px;
                    padding: 0 22px;
                    font-size: 15px;
                    font-weight: 800;
                    text-decoration: none;
                    transition:
                        background-color 160ms ease,
                        color 160ms ease,
                        transform 160ms ease;
                }
                .marketing-fallback__action--primary {
                    background: #17131f;
                    color: #ffffff;
                }
                .marketing-fallback__action--secondary {
                    background: #ebe4ff;
                    color: #5c3dc4;
                }
                .marketing-fallback__action--primary:hover,
                .marketing-fallback__action--primary:focus-visible {
                    background: #7047eb;
                    color: #ffffff;
                    transform: translateY(-2px);
                }
                .marketing-fallback__action--secondary:hover,
                .marketing-fallback__action--secondary:focus-visible {
                    background: #dcd0ff;
                    color: #3b237f;
                    transform: translateY(-2px);
                }
                .marketing-fallback__action:focus-visible {
                    outline: none;
                }
                .marketing-fallback__visual {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    min-width: 0;
                }
                .marketing-fallback__visual img {
                    display: block;
                    width: min(100%, 620px);
                    height: auto;
                }
                @media (min-width: 768px) {
                    .marketing-fallback__header {
                        height: 72px;
                        padding: 0 32px;
                    }
                    .marketing-fallback__logo {
                        height: 32px;
                    }
                    .marketing-fallback__hero {
                        min-height: calc(100vh - 72px);
                        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
                        gap: 56px;
                        padding: 72px 32px 56px;
                    }
                    .marketing-fallback__title {
                        font-size: clamp(48px, 4.2vw, 62px);
                    }
                    .marketing-fallback__description {
                        font-size: 18px;
                    }
                    .marketing-fallback__visual img {
                        width: 116%;
                        max-width: 720px;
                    }
                }
                @media (max-width: 767px) {
                    .marketing-fallback__hero {
                        align-content: center;
                    }
                    .marketing-fallback__visual {
                        margin: 0 -8px;
                    }
                    .marketing-fallback__actions {
                        display: grid;
                    }
                    .marketing-fallback__action {
                        width: 100%;
                    }
                }
                @media (prefers-reduced-motion: reduce) {
                    .marketing-fallback__action {
                        transition: none;
                    }
                }
                @media (forced-colors: active) {
                    .marketing-fallback__action:focus-visible {
                        outline: 2px solid ButtonText;
                        outline-offset: 3px;
                    }
                }
