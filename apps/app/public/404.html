<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>페이지를 찾을 수 없습니다 | 듀팅</title>
        <meta name="description" content="요청한 듀팅 앱 페이지를 찾을 수 없습니다. 주소를 확인하거나 듀팅 홈으로 이동해주세요." />
        <meta name="robots" content="noindex, follow" />
        <style>
            :root {
                color-scheme: light;
                font-family: 'SUIT Variable', 'Pretendard Variable', 'Apple SD Gothic Neo', sans-serif;
            }
            body {
                display: grid;
                min-height: 100vh;
                place-items: center;
                margin: 0;
                padding: 24px;
                box-sizing: border-box;
                color: #241b35;
                background: #faf8fb;
                text-align: center;
            }
            p {
                margin: 0 0 12px;
                color: #6c4fe0;
                font-weight: 800;
            }
            h1 {
                margin: 0;
                font-size: clamp(2rem, 6vw, 3rem);
                line-height: 1.25;
                word-break: keep-all;
            }
            .description {
                margin: 18px 0 28px;
                color: #5d566b;
                font-weight: 500;
                line-height: 1.7;
            }
            a {
                display: inline-flex;
                min-height: 48px;
                align-items: center;
                justify-content: center;
                padding: 0 20px;
                border-radius: 10px;
                color: #fff;
                background: #6c4fe0;
                font-weight: 800;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <p>404</p>
            <h1>페이지를 찾을 수 없습니다</h1>
            <p class="description">주소가 잘못 입력되었거나 페이지가 이동되었습니다.</p>
            <a href="/">듀팅 앱 홈으로 이동</a>
        </main>
    </body>
</html>
