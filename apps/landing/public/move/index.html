<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>새로운 듀팅으로 이동</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff;
        color: #1c1c1e;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard',
          'Malgun Gothic', sans-serif;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #4b4b52;
        margin: 0 0 24px;
      }
      .buttons {
        display: grid;
        gap: 10px;
      }
      a.button {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px 20px;
        border-radius: 12px;
        background: #6c5ce7;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: #8e8e93;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>새로운 듀팅으로 이동합니다</h1>
      <p>
        듀팅이 새 앱으로 옮겨갑니다.<br />
        스토어에서 새 듀팅을 설치해 주세요.
      </p>
      <div class="buttons">
        <a class="button" id="ios-store" href="https://apps.apple.com/us/app/dutying-nurse-shift-calendar/id6804144827">App Store에서 받기</a>
        <a class="button" id="android-store" href="https://play.google.com/store/apps/details?id=ai.dutying.app">Google Play에서 받기</a>
      </div>
      <p class="hint" id="hint">새 앱이 이미 설치되어 있다면 자동으로 열립니다.</p>
    </main>
    <script>
      (function () {
        var iosStoreLinks = {
          ja: 'https://apps.apple.com/jp/app/dutying-%E7%9C%8B%E8%AD%B7%E5%B8%AB%E3%82%B7%E3%83%95%E3%83%88%E7%AE%A1%E7%90%86/id6804144827',
          ko: 'https://apps.apple.com/kr/app/dutying-%E7%9C%8B%E8%AD%B7%E5%B8%AB%E3%82%B7%E3%83%95%E3%83%88%E7%AE%A1%E7%90%86/id6804144827',
          default: 'https://apps.apple.com/us/app/dutying-nurse-shift-calendar/id6804144827',
        };
        var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        var normalizedLanguages = languages.map(function (language) {
          return String(language).toLowerCase();
        });
        var iosStoreLink = iosStoreLinks.default;
        if (normalizedLanguages.some(function (language) {
          return language.indexOf('ja') === 0;
        })) {
          iosStoreLink = iosStoreLinks.ja;
        } else if (normalizedLanguages.some(function (language) {
          return language.indexOf('ko') === 0;
        })) {
          iosStoreLink = iosStoreLinks.ko;
        }
        document.getElementById('ios-store').href = iosStoreLink;

        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        var isAndroid = /Android/.test(navigator.userAgent);
        if (isIOS) {
          setTimeout(function () {
            location.replace(document.getElementById('ios-store').href);
          }, 1200);
          return;
        }
        if (isAndroid) {
          setTimeout(function () {
            location.replace(document.getElementById('android-store').href);
          }, 1200);
          return;
        }
      })();
    </script>
  </body>
</html>
