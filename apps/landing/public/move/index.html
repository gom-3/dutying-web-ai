<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>새로운 듀팅으로 이동</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fff;
        color: #1c1c1e;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard',
          'Malgun Gothic', sans-serif;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #4b4b52;
        margin: 0 0 24px;
      }
      a.button {
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
        padding: 14px 20px;
        border-radius: 12px;
        background: #6c5ce7;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: #8e8e93;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>새로운 듀팅으로 이동합니다</h1>
      <p>
        듀팅이 새 앱으로 옮겨갑니다.<br />
        앱스토어에서 새 듀팅을 설치해 주세요.
      </p>
      <a class="button" id="store" href="https://apps.apple.com/kr/app/id6804144827">App Store에서 받기</a>
      <p class="hint" id="hint">새 앱이 이미 설치되어 있다면 자동으로 열립니다.</p>
    </main>
    <script>
      (function () {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          setTimeout(function () {
            location.replace(document.getElementById('store').href);
          }, 1200);
          return;
        }
        var store = document.getElementById('store');
        store.removeAttribute('href');
        store.style.background = '#c7c7cc';
        store.textContent = 'iOS에서 먼저 만나요';
        document.getElementById('hint').textContent =
          '안드로이드 새 앱은 준비 중이에요. 기존 앱을 계속 사용해 주세요.';
      })();
    </script>
  </body>
</html>
